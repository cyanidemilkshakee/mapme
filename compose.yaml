services:
  kong:
    image: kong:3.9.4
    user: "1337:1337"
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /gateway-config/kong.json
      KONG_PREFIX: /tmp/kong
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_STATUS_LISTEN: "127.0.0.1:8100"
      KONG_HEADERS: "off"
      KONG_PROXY_ACCESS_LOG: "off"
      KONG_TRUSTED_IPS: ${KONG_TRUSTED_IPS:-${SPOTTER_PROXY_IP:-}}
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_NGINX_PROXY_CLIENT_MAX_BODY_SIZE: 64k
      KONG_NGINX_HTTP_LIMIT_REQ_ZONE: "$$binary_remote_addr zone=spotter_edge:10m rate=20r/s"
      KONG_NGINX_PROXY_LIMIT_REQ: "zone=spotter_edge burst=40 nodelay"
      KONG_NGINX_PROXY_LIMIT_REQ_STATUS: "429"
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_NGINX_HTTP_GZIP: "on"
      KONG_NGINX_HTTP_GZIP_TYPES: application/json application/x-ndjson
      KONG_NGINX_HTTP_GZIP_PROXIED: any
    ports:
      - "127.0.0.1:${WEB_PORT:-10001}:8000"
    volumes:
      - gateway_config:/gateway-config:ro
    networks: [edge, proxy, web, api, gateway_state]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      gateway-config:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health", "-p", "/tmp/kong"]
      interval: 5s
      timeout: 10s
      retries: 15

  gateway-config:
    image: spotter-gateway-config:local
    build: ./gateway
    command: ["--hold"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    environment:
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-local}
      KONG_TRUSTED_IPS: ${KONG_TRUSTED_IPS:-${SPOTTER_PROXY_IP:-}}
      SPOTTER_GATEWAY_TOKEN: ${SPOTTER_GATEWAY_TOKEN:-}
      SPOTTER_GATEWAY_ACCESS: ${SPOTTER_GATEWAY_ACCESS:-}
      SPOTTER_GATEWAY_USERNAME: ${SPOTTER_GATEWAY_USERNAME:-}
      SPOTTER_GATEWAY_PASSWORD: ${SPOTTER_GATEWAY_PASSWORD:-}
    volumes:
      - gateway_config:/gateway-config
    healthcheck:
      test: ["CMD", "test", "-s", "/gateway-config/kong.json"]
      interval: 3s
      timeout: 5s
      retries: 10

  gateway-redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    networks: [gateway_state]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [application_state]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: truck-routing-backend:local
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ENVIRONMENT: ${DJANGO_ENVIRONMENT:-local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-backend}
      DJANGO_DATABASE_PATH: /data/db.sqlite3
      REDIS_URL: redis://redis:6379/1
      SPOTTER_GATEWAY_TOKEN: ${SPOTTER_GATEWAY_TOKEN:-}
      API_TRUSTED_PROXY_COUNT: "1"
      API_REQUEST_RATE: ${API_REQUEST_RATE:-150/minute}
      API_PLAN_RATE: ${API_PLAN_RATE:-15/minute}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_WEATHER_MAX_POINTS: ${GOOGLE_WEATHER_MAX_POINTS:-120}
    volumes:
      - backend_data:/data
    networks: [api, application_state, provider_egress]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10002/api/ready', timeout=3)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  frontend:
    image: truck-routing-frontend:local
    build: ./frontend
    restart: unless-stopped
    networks: [web]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  https-proxy:
    image: caddy:2-alpine
    profiles: [production]
    restart: unless-stopped
    environment:
      SPOTTER_DOMAIN: ${SPOTTER_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: ${SPOTTER_PROXY_IP:-}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    depends_on:
      kong:
        condition: service_healthy

networks:
  edge:
  proxy:
    ipam:
      config:
        - subnet: ${SPOTTER_PROXY_SUBNET:-}
  provider_egress:
  api:
    internal: true
  web:
    internal: true
  gateway_state:
    internal: true
  application_state:
    internal: true

volumes:
  backend_data:
  caddy_data:
  caddy_config:
  gateway_config:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0755,nosuid,nodev,noexec"
