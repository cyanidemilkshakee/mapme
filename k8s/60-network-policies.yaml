apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-only-from-kong
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [backend, frontend]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kong
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 10002 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-redis-only-from-backend
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - { protocol: TCP, port: 6379 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-redis-only-from-kong
spec:
  podSelector:
    matchLabels:
      app: gateway-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kong
      ports:
        - { protocol: TCP, port: 6379 }
